name: Deploy to AWS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Starting deployment..."
            echo "Commit: ${{ github.sha }}"
            echo "Author: ${{ github.actor }}"
            echo ""
            
            cd /home/ubuntu/todo-api-docker
            
            # Fix git ownership issue
            git config --global --add safe.directory /home/ubuntu/todo-api-docker
            
            # Pull latest code
            echo "📦 Pulling latest code..."
            git pull origin main
            
            # Stop all containers
            echo "🛑 Stopping all containers..."
            docker-compose down
            
            # Remove old containers and images
            echo "🧹 Cleaning up..."
            docker rm -f todo-frontend todo-nginx todo-api todo-mongo 2>/dev/null || true
            docker rmi todo-api-docker_frontend todo-api-docker_nginx 2>/dev/null || true
            
            # Build with NO cache
            echo "🔨 Building with --no-cache..."
            docker-compose build --no-cache
            
            # Start containers
            echo "🚀 Starting containers..."
            docker-compose up -d
            
            # Wait for services
            echo "⏳ Waiting for services..."
            sleep 20
            
            # Health check
            echo "🏥 Health check..."
            if curl -s http://localhost:3000/health | grep -q "OK"; then
              echo "✅ Health check passed!"
            else
              echo "⚠️  Health check failed..."
              docker logs todo-api --tail 20
            fi
            
            echo ""
            echo "📊 Container Status:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
            echo ""
            echo "✅ Deployment Complete!"
            echo "🌐 URL: https://${{ secrets.EC2_HOST }}.sslip.io"
            echo "💡 Hard refresh: Cmd+Shift+R or Ctrl+Shift+R"
