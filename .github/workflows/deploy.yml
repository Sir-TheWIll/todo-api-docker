name: Deploy to AWS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Run Tests
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          cd api
          npm ci
      
      - name: Run API tests
        run: |
          echo "🧪 Running API tests..."
          # Add your test commands here
          echo "✅ Tests passed"

  # Job 2: Build and Push Docker Images
  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/todo-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/todo-api:buildcache,mode=max
      
      - name: Generate build metadata
        run: |
          echo "Build Time: $(date)" > build-info.txt
          echo "Commit: ${{ github.sha }}" >> build-info.txt
          echo "Branch: ${{ github.ref_name }}" >> build-info.txt
          echo "Author: ${{ github.actor }}" >> build-info.txt
      
      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.txt

  # Job 3: Deploy to AWS EC2
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Starting deployment..."
            echo "Commit: ${{ github.sha }}"
            echo "Author: ${{ github.actor }}"
            echo ""
            
            # Navigate to app directory
            cd /home/ubuntu/todo-api-docker
            
            # Pull latest code
            echo "📦 Pulling latest code..."
            git pull origin main
            
            # Stop old containers
            echo "🛑 Stopping containers..."
            docker-compose down
            
            # Remove old images
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            # Build new images
            echo "🔨 Building new images..."
            docker-compose build --no-cache
            
            # Start new containers
            echo "🚀 Starting containers..."
            docker-compose up -d
            
            # Wait for services
            echo "⏳ Waiting for services to start..."
            sleep 15
            
            # Health check
            echo "🏥 Running health check..."
            for i in {1..5}; do
              if curl -s http://localhost:3000/health | grep -q "OK"; then
                echo "✅ Health check passed!"
                break
              fi
              echo "Attempt $i: Waiting for service..."
              sleep 5
            done
            
            # Show container status
            echo ""
            echo "📊 Container Status:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
            # Show logs
            echo ""
            echo "📋 Recent API Logs:"
            docker logs todo-api --tail 10
            
            echo ""
            echo "✅ Deployment Complete!"
            echo "🌐 Application URL: https://${{ secrets.EC2_HOST }}.sslip.io"
      
      - name: Deployment Summary
        run: |
          echo "## 🎉 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Application URL:** https://${{ secrets.EC2_HOST }}.sslip.io" >> $GITHUB_STEP_SUMMARY