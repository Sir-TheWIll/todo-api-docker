[defaults]
inventory = ./inventory.ini
remote_user = ubuntu
host_key_checking = False
retry_files_enabled = False
timeout = 30
private_key_file = ~/.ssh/todo-api-key

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
become_flags = '-H -S'

[ssh_connection]
pipelining = True
control_path = /tmp/ansible-%%h-%%p-%%r
