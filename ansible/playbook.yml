---
- name: Configure Todo API Docker Server
  hosts: todo_servers
  become: yes
  gather_facts: yes

  vars:
    app_dir: /home/ubuntu/todo-api-docker
    docker_compose_version: "v2.24.0"

  tasks:
    - name: Clean up conflicting Docker repository files
      shell: |
        rm -f /etc/apt/sources.list.d/docker.list
        rm -f /etc/apt/sources.list.d/docker.list.save
        rm -f /etc/apt/keyrings/docker.gpg
        rm -f /etc/apt/keyrings/docker.asc
        apt-get clean
      ignore_errors: yes

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

    - name: Install required packages
      apt:
        name:
          - git
          - curl
          - wget
        state: present

    - name: Install Docker using official script
      shell: |
        curl -fsSL https://get.docker.com -o get-docker.sh
        sh get-docker.sh
      args:
        creates: /usr/bin/docker

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Install Docker Compose standalone
      get_url:
        url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-Linux-x86_64"
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Clone application repository
      git:
        repo: "https://github.com/{{ github_username | default('Sir-TheWILL') }}/todo-api-docker.git"
        dest: "{{ app_dir }}"
        version: main
        force: yes
      become_user: ubuntu
      ignore_errors: yes

    - name: Create SSL directory
      file:
        path: "{{ app_dir }}/nginx/ssl"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
      become_user: ubuntu

    - name: Generate self-signed SSL certificate
      command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout {{ app_dir }}/nginx/ssl/nginx.key
        -out {{ app_dir }}/nginx/ssl/nginx.crt
        -subj "/C=US/ST=California/L=SanFrancisco/O=DevOps/CN={{ ansible_host }}.sslip.io"
      args:
        creates: "{{ app_dir }}/nginx/ssl/nginx.crt"
      become_user: ubuntu

    - name: Set SSL key permissions
      file:
        path: "{{ app_dir }}/nginx/ssl/nginx.key"
        mode: '0600'
        owner: ubuntu
        group: ubuntu

    - name: Set SSL certificate permissions
      file:
        path: "{{ app_dir }}/nginx/ssl/nginx.crt"
        mode: '0644'
        owner: ubuntu
        group: ubuntu

    - name: Create .env file
      copy:
        dest: "{{ app_dir }}/.env"
        content: |
          PORT=3000
          MONGODB_URI=mongodb://todo-mongo:27017/todos
          NODE_ENV=production
        owner: ubuntu
        group: ubuntu
        mode: '0644'
      become_user: ubuntu

    - name: Build and start Docker containers
      command: docker-compose up -d --build
      args:
        chdir: "{{ app_dir }}"
      become_user: ubuntu

    - name: Wait for services
      wait_for:
        timeout: 30

    - name: Verify API is running
      uri:
        url: "http://localhost:3000/health"
        method: GET
        status_code: 200
      register: health_check
      retries: 5
      delay: 5
      until: health_check.status == 200

    - name: Clean up Docker images
      command: docker image prune -f
      become_user: ubuntu
      ignore_errors: yes
